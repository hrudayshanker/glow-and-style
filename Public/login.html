<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Glow & Style</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Glow & Style</h1>
        <p>Welcome back!</p>
    </header>

    <main>
        <section style="max-width: 450px; margin: 60px auto; padding: 20px;">

            <h2>Customer Login</h2>

            <p>Sign in to continue to your salon appointments.</p>

            <form id="loginForm">

                <label for="email">Email Address</label>
                <br>

                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    required
                    style="width: 100%; padding: 12px; box-sizing: border-box;"
                >

                <br><br>

                <label for="password">Password</label>
                <br>

                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    required
                    style="width: 100%; padding: 12px; box-sizing: border-box;"
                >

                <br><br>

                <button
                    type="submit"
                    class="primary-button"
                    id="loginButton"
                >
                    Log In
                </button>

                <p id="message" role="status" aria-live="polite"></p>

            </form>

            <p>
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

            <p><a href="/">Back to Home</a></p>

        </section>
    </main>

    <footer>
        <p>© 2026 Glow & Style Salon</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="login.js"></script>

</body>
</html>
