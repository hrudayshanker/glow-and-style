<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Glow & Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">Glow <span>& Style</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Sign Up</a>
        </nav>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Customer Login</h2>
                <p>Sign in to continue to your salon appointments.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" autocomplete="email" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
                </div>

                <button type="submit" class="primary-button full-width" id="loginButton">
                    Log In
                </button>

                <p id="message" role="status" aria-live="polite"></p>
            </form>

            <div class="auth-footer-links">
                <p>Don't have an account? <a href="register.html">Create an account</a></p>
                <p><a href="index.html">← Back to Home</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Glow & Style Salon</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="login_js.txt"></script>
</body>
</html>
