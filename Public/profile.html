<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Glow & Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <a href="/" class="logo">Glow <span>& Style</span></a>
    <nav>
        <a href="/">Home</a>
        <a href="/booking.html">Book Appointment</a>
        <a href="/profile.html">My Profile</a>
        <button id="logoutButton">Logout</button>
    </nav>
</header>

<main style="max-width: 1100px; margin: 50px auto; padding: 20px;">

    <section class="booking-banner">
        <div>
            <p class="eyebrow">CUSTOMER ACCOUNT</p>
            <h1>Welcome, <span id="customerName">Loading...</span></h1>
            <p id="customerEmail"></p>
        </div>
    </section>

    <section style="margin-top: 40px;">
        <h2>My Upcoming Appointments</h2>
        <div id="upcomingAppointments">
            Loading appointments...
        </div>
    </section>

    <section style="margin-top: 40px;">
        <h2>Appointment History</h2>
        <div id="pastAppointments">
            Loading history...
        </div>
    </section>

    <p id="profileMessage" role="status"></p>

</main>

<footer>
    <p>© 2026 Glow & Style Salon</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="profile.js"></script>

</body>
</html>
