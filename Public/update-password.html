<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Password | Glow & Style</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f4f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 350px;
            max-width: calc(100% - 70px);
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: #573344;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #8b5267;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Create New Password</h2>

        <p>Enter your new administrator password.</p>

        <form id="passwordForm">

            <input
                type="password"
                id="newPassword"
                placeholder="New password"
                minlength="8"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                required
            >

            <button type="submit" id="updateButton">
                Update Password
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        const form = document.getElementById("passwordForm");
        const message = document.getElementById("message");
        const button = document.getElementById("updateButton");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const password = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                message.style.color = "red";
                message.textContent = "Passwords do not match.";
                return;
            }

            button.disabled = true;
            button.textContent = "Updating...";

            try {
                const { data: sessionData, error: sessionError } =
                    await supabaseClient.auth.getSession();

                if (sessionError) throw sessionError;

                if (!sessionData.session) {
                    throw new Error("Your reset link is invalid or expired. Please request a new one.");
                }

                const { error } = await supabaseClient.auth.updateUser({
                    password: password
                });

                if (error) throw error;

                message.style.color = "green";
                message.textContent = "Password updated successfully! You can now log in.";

                form.reset();

            } catch (error) {

                message.style.color = "red";
                message.textContent = error.message;

            }

            button.disabled = false;
            button.textContent = "Update Password";

        });
    </script>

</body>
</html>
