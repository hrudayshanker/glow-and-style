<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Glow & Style</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">Glow <span>& Style</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Create Your Account</h2>
                <p>Register to book your salon appointments.</p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        autocomplete="name"
                        required
                        placeholder="John Doe"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        required
                        placeholder="name@example.com"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                        placeholder="At least 6 characters"
                    >
                </div>

                <button
                    type="submit"
                    class="primary-button full-width"
                    style="margin-top: 10px;"
                >
                    Create Account
                </button>

                <p id="message" role="status" aria-live="polite" style="margin-top: 12px; font-size: 13px; font-weight: 500; text-align: center;"></p>

            </form>

            <div class="auth-footer-links">
                <p>
                    Already have an account?
                    <a href="login.html">Log in</a>
                </p>
                <p style="margin-top: 8px;"><a href="index.html">← Back to Home</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Glow &amp; Style Salon</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="register.js"></script>

</body>
</html>
