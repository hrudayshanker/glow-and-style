<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Glow & Style</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f4f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 350px;
            max-width: calc(100% - 70px);
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: #573344;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #8b5267;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Forgot Password?</h2>

        <p>Enter your registered email address. We'll send you a password-reset link.</p>

        <form id="resetForm">

            <input
                type="email"
                id="email"
                placeholder="Your email address"
                required
            >

            <button type="submit" id="resetButton">
                Send Reset Link
            </button>

        </form>
        <p style="text-align: center; margin-top: 15px;">
    <a href="/forgot-password.html" style="color: #8b5267;">
        Forgot Password?
    </a>
</p>

        <p id="message"></p>

        <a href="/admin-login.html">Back to Admin Login</a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        document.getElementById("resetForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const button = document.getElementById("resetButton");
            const message = document.getElementById("message");

            button.disabled = true;
            button.textContent = "Sending...";
            message.textContent = "";

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo: window.location.origin + "/update-password.html"
                    }
                );

                if (error) throw error;

                message.style.color = "green";
                message.textContent = "If an account exists for this email, a password-reset link has been sent. Please check your inbox.";

            } catch (error) {

                message.style.color = "red";
                message.textContent = error.message;

            }

            button.disabled = false;
            button.textContent = "Send Reset Link";

        });
    </script>

</body>
</html>
